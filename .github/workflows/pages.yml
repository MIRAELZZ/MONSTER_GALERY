name: Deploy Monster Gallery

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      # Reuse thumbnails from earlier builds; only new/changed images are processed.
      - uses: actions/cache@v4
        with:
          path: .thumbcache
          key: thumbs-${{ hashFiles('Monster_Detail*/**') }}
          restore-keys: thumbs-
      # Full-size images are served straight from this commit on GitHub, so the
      # Pages upload holds only the thumbnails (the 1 GB Pages limit stays far off).
      - run: python scripts/build.py
        env:
          ORIGINALS_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Only the default branch is published to GitHub Pages.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
