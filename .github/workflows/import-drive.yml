name: Import images from Google Drive

on:
  workflow_dispatch:
    inputs:
      plan_a_folder:
        description: "Google Drive folder ID for Plan A (Monster_Detail) — kosongkan untuk lewati"
        default: "1FDYGY695ufUr-iDahl6UyeH4TwDCuH9j"
      plan_b_folder:
        description: "Google Drive folder ID for Plan B (Monster_Detail1) — kosongkan untuk lewati"
        default: "1ff802MXEqR0g8x3b1Ii-deR_Xkl6iBB3"
      plan_c_folder:
        description: "Google Drive folder ID for Plan C (Monster_Detail2) — kosongkan untuk lewati"
        default: ""
      plan_d_folder:
        description: "Google Drive folder ID for Plan D (Monster_Detail3) — boleh beberapa, pisahkan koma"
        default: ""
      plan_e_folder:
        description: "Google Drive folder ID for Plan E (Monster_Detail4) — boleh beberapa, pisahkan koma"
        default: ""
      plan_f_folder:
        description: "Google Drive folder ID for Plan F (Monster_Detail5) — boleh beberapa, pisahkan koma"
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download images
        run: >
          python scripts/import_drive.py
          ${{ inputs.plan_a_folder && format('"{0}:Monster_Detail"', inputs.plan_a_folder) || '' }}
          ${{ inputs.plan_b_folder && format('"{0}:Monster_Detail1"', inputs.plan_b_folder) || '' }}
          ${{ inputs.plan_c_folder && format('"{0}:Monster_Detail2"', inputs.plan_c_folder) || '' }}
          ${{ inputs.plan_d_folder && format('"{0}:Monster_Detail3"', inputs.plan_d_folder) || '' }}
          ${{ inputs.plan_e_folder && format('"{0}:Monster_Detail4"', inputs.plan_e_folder) || '' }}
          ${{ inputs.plan_f_folder && format('"{0}:Monster_Detail5"', inputs.plan_f_folder) || '' }}
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A Monster_Detail*
          if git diff --cached --quiet; then
            echo "Tidak ada gambar baru."
          else
            git commit -m "Import monster images from Google Drive"
            git push
          fi
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Deploy gallery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
